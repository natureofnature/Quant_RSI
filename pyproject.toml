[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-rsi"
version = "0.1.0"
description = "Reproducible development experiments for quant research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "lightgbm>=4.6,<5", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
# The GPL ibapi package itself is installed locally from the TWS API distribution.
ibkr = ["protobuf==5.29.5"]

[project.scripts]
quant-rsi = "quant_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
