[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-rsi"
version = "0.1.0"
description = "Reproducible development experiments for quant research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "lightgbm>=4.6,<5", "pydantic>=2.10,<3", "pypdf>=6.21.4,<7", "fonttools>=4.68,<5", "openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
gpr = ["xlrd>=2.0.2,<3"]
# The GPL ibapi package itself is installed locally from the TWS API distribution.
ibkr = ["protobuf==5.29.5"]

[project.scripts]
quant-rsi = "quant_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant_rsi.research" = [
    "study_ui.html",
    "study_ui_cards.js",
    "study_workbench.html",
    "study_constellation.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
