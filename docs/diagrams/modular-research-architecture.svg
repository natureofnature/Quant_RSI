<text x="72" y="65" font-size="14" fill="#4267ad" font-weight="700">QUANT RSI</text>
<text x="72" y="117" font-size="38" fill="#18283e" font-weight="700">Modular Research Architecture</text>
<text x="72" y="151" font-size="18" fill="#69788b">Outer research plans the next question. Inner batches execute. Persisted evidence guides the next iteration.</text>
