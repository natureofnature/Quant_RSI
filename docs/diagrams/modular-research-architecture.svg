<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1430" viewBox="0 0 1600 1430" role="img" aria-labelledby="title desc">
<title id="title">Quant RSI — Modular Research Architecture</title>
<desc id="desc">The outer Research Loop reads Memory, investigates evidence, synthesizes factors and plans experiments. The inner Experiment Runner executes bounded batches. Workflow code persists development results to Memory before the next decision; agent interpretations are recorded separately. Shared time and budget constraints apply throughout.</desc>
