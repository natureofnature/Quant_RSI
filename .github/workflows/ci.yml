name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Check lint and formatting
        run: |
          ruff check src tests examples/profile_validation.py
          ruff format --check src tests examples/profile_validation.py

      - name: Run critical regression tests
        run: python examples/profile_validation.py --suite critical --output "$RUNNER_TEMP/validation-profile" --shards 2

      - name: Preserve validation timings and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-profile-${{ github.sha }}
          path: |
            ${{ runner.temp }}/validation-profile/*.json
            ${{ runner.temp }}/validation-profile/*.xml
            ${{ runner.temp }}/validation-profile/*.log
          if-no-files-found: warn
          retention-days: 14
